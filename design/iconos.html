<title>Iconos de ZenInk</title>
<style>
  body { margin: 0; background: #fafafa; color: #1a1a1a; font-family: "Segoe UI", system-ui, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; padding: 28px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 8px; background: #fff; border: 1px solid #e6e6e6; border-radius: 8px; }
  .cell svg { width: 76px; height: 76px; }
  .cell .small { width: 19px; height: 19px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .name { font-size: 12px; color: #666; }
  h1 { font-size: 18px; margin: 0; padding: 24px 28px 0; }
</style>

<h1>Iconos de ZenInk — trazado a 20×20, tal cual van en la barra</h1>
<div class="grid" id="grid"></div>

    `<svg class="${cls}" viewBox="0 0 20 20" fill="${filled ? 'currentColor' : 'none'}" stroke="${filled ? 'none' : 'currentColor'}"

  document.getElementById('grid').innerHTML = icons.map(([name, d, w, filled]) => `
    <div class="cell">
      ${svg(d, w, filled, '')}
      <div class="row">${svg(d, w, filled, 'small')}<span class="name">${name}</span></div>
    </div>`).join('');
